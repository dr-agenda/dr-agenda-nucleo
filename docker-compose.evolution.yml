# ==============================================================================
# Docker Compose — Evolution API dedicada para Dr Agenda Núcleos
# Dominio objetivo: https://whatsapp.dragendas.com
# ==============================================================================
# NOTA IMPORTANTE DE AISLAMIENTO:
# Este stack usa el puerto local 8081 (127.0.0.1:8081 -> 8080) y nombres de
# contenedor propios (dragendas_*) para NO chocar con el contenedor existente
# drtrevino_evolution_api que ocupa el puerto 8080.
# ==============================================================================

services:
  dragendas_evolution_api:
    image: atendai/evolution-api:v2.1.1
    container_name: dragendas_evolution_api
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SERVER_URL=https://whatsapp.dragendas.com
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-DrAgendas_WA_ClaveSecreta_2026_CambiaEsto}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:dragendas_evo_pass@dragendas_evolution_postgres:5432/evolution_dragendas?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://dragendas_evolution_redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=dragendas_evo
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
    volumes:
      - dragendas_evolution_instances:/evolution/instances
    depends_on:
      - dragendas_evolution_postgres
      - dragendas_evolution_redis
    networks:
      - dragendas_evo_net

  dragendas_evolution_postgres:
    image: postgres:15-alpine
    container_name: dragendas_evolution_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dragendas_evo_pass
      - POSTGRES_DB=evolution_dragendas
    volumes:
      - dragendas_evolution_pgdata:/var/lib/postgresql/data
    networks:
      - dragendas_evo_net

  dragendas_evolution_redis:
    image: redis:7-alpine
    container_name: dragendas_evolution_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dragendas_evolution_redisdata:/data
    networks:
      - dragendas_evo_net

  # Opcional: Si usas un túnel de Cloudflare dedicado para whatsapp.dragendas.com
  # descomenta este bloque o agrega el Public Hostname whatsapp.dragendas.com -> http://host.docker.internal:8081
  # en tu panel de Cloudflare Zero Trust -> Networks -> Tunnels.
  # dragendas_cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: dragendas_cloudflared
  #   restart: always
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   networks:
  #     - dragendas_evo_net

volumes:
  dragendas_evolution_instances:
  dragendas_evolution_pgdata:
  dragendas_evolution_redisdata:

networks:
  dragendas_evo_net:
    driver: bridge
